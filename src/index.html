<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de la Pràctica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Champions League</h1>
<div class="panell">

    <!-- Formulari d'entrada de dades -->
    <div class="card">
        <div class="card.box"></div>
        <h2>Añade un Club</h2>

        <div class="field">
            <label for="iNom">Club:</label>
            <input type="text" id="iNom" placeholder="Añade un club...">
        </div>

        <div class="field">
            <label for="iValor">Puntos:</label>
            <input type="number" id="iValor" value="0" min="0">
        </div>

        <div class="field">
            <label for="iValor2">GF:</label>
            <input type="number" id="iValor2" value="0" min="0">
        </div>


        <div class="field">
            <label for="iValor3">GC:</label>
            <input type="number" id="iValor3" value="0" min="0">
        </div>

        <button id="btnAfegir">Añadir a la clasificación</button>

        <button onclick="ordenarPts()">Ordenar por punts</button>

        <button onclick="ordenarGFGC()">Ordenar por GF/GC</button>

        <div class="LeyendaClubs">
            <div class="Clasificados"><h3>Clasificados para la eliminatoria</h3></div>
        </div>

    </div>

<div>

    <div class="cardTitulos">
        <h2>Clubs</h2>
        <h2>Puntos</h2>
        <h2>GF/GC</h2>
    </div>
    <div id="contenedorlista"></div>
</div>

    <div>
        <div class="cardTitulos2">
            <h2>Clubs</h2>
            <h2>Puntos</h2>
            <h2>GF/GC</h2>
        </div>
        <div id="contenedorlista2"></div>
    </div>







</div>






<script src="app.js"></script>
</body>
</html>
